name: CI

# 복사된 타입이 세 곳에 있어서, 한 곳만 고쳐도 나머지는 그대로 컴파일된다.
# 깨진 사실이 앱을 켜야만 드러나므로 push마다 세 워크스페이스를 함께 돌린다.
#
# Node 22 이상이 필요하다. jsdom과 supertest가 쓰는 undici가
# webidl.util.markAsUncloneable을 요구하는데 Node 20에는 없어서,
# 통합 테스트와 확장 테스트가 통째로 "Test suite failed to run"이 된다.
on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 push하면 앞선 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 서버 (빌드 · 단위 · 통합)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - name: 타입 검사
        run: npx tsc --noEmit
        working-directory: server

      - name: 빌드
        run: npm run build
        working-directory: server

      - name: 단위 테스트
        run: npm test
        working-directory: server

      # testcontainers가 Postgres를 직접 띄운다.
      # ubuntu-latest 러너에는 Docker가 이미 있으므로 services 블록이 필요 없다.
      - name: 통합 테스트
        run: npm run test:e2e
        working-directory: server

  web:
    name: 웹 (빌드 · 테스트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: 타입 검사
        run: npx tsc --noEmit
        working-directory: web

      # 확장 테스트가 저장소 루트의 content.js를 읽으므로
      # web/ 만 체크아웃해서는 돌지 않는다.
      - name: 테스트
        run: npm test
        working-directory: web

      - name: 빌드
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000

  mobile:
    name: 모바일 (타입 검사)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
        working-directory: mobile

      # 네이티브 빌드는 CI에서 돌리지 않는다.
      # 여기서 잡고 싶은 것은 server/web과 어긋난 타입이다.
      - name: 타입 검사
        run: npx tsc --noEmit
        working-directory: mobile

  extension:
    name: 확장 (문법 검사)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # content.js는 빌드 과정이 없는 단일 IIFE라 컴파일러가 봐 주지 않는다.
      # 최소한 문법이 깨진 채로 머지되는 것은 막는다.
      - name: content.js 문법
        run: node --check content.js

      - name: manifest.json 형식
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
